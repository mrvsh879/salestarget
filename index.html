<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Month Plan MVP</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <h1>План месяца</h1>
        <p class="sub">План / остаток / нужно в день + календарь</p>
      </div>
    </header>

    <!-- SETTINGS -->
    <section class="card grid2">
      <div class="field">
        <label>Месяц</label>
        <div class="row">
          <select id="month"></select>
          <select id="year"></select>
        </div>
        <div class="hint" id="monthMeta"></div>
      </div>

      <div class="field">
        <label>План месяца</label>
        <div class="row">
          <input id="monthPlan" type="number" min="0" />
          <button id="btnSavePlan" class="btn">Сохранить</button>
        </div>
      </div>

      <div class="field">
        <label>Факт</label>
        <div class="row">
          <input id="monthDone" type="number" min="0" />
          <button id="btnSaveDone" class="btn">Сохранить</button>
        </div>
      </div>

      <div class="field">
        <label>Настройки</label>
        <label class="check">
          <input id="includeWeekends" type="checkbox" />
          Считать выходные рабочими
        </label>
        <label class="check">
          <input id="doneFromCalendar" type="checkbox" />
          Факт из календаря
        </label>
      </div>
    </section>

    <!-- TOTALS -->
    <section class="card">
      <div class="kpis">
        <div class="kpi"><div class="k">План</div><div class="v" id="kPlan">0</div></div>
        <div class="kpi"><div class="k">Сделано</div><div class="v" id="kDone">0</div></div>
        <div class="kpi"><div class="k">Осталось</div><div class="v" id="kLeft">0</div></div>
        <div class="kpi"><div class="k">Рабочих дней</div><div class="v" id="kDaysLeft">0</div></div>
        <div class="kpi"><div class="k">Нужно в день</div><div class="v" id="kPerDay">0</div></div>
      </div>
      <div class="note" id="calcNote"></div>
    </section>

    <!-- CALENDAR -->
    <section class="card">
      <div class="cardHead">
        <h2>Календарь</h2>
        <div>
          <button id="btnToggleCalendar" class="btn ghost">Скрыть календарь</button>
          <button id="btnClearCalendar" class="btn ghost">Очистить</button>
        </div>
      </div>

      <div id="calendarPanel">
        <div class="calendar" id="calendar"></div>
      </div>
    </section>
  </div>

  <!-- MODAL -->
  <div class="modal" id="dayModal">
    <div class="modalBox">
      <div class="modalHead">
        <div id="dayModalTitle"></div>
        <button id="dayModalClose">✕</button>
      </div>
      <div class="modalBody">
        <input id="dayValue" type="number" min="0" />
      </div>
      <div class="modalActions">
        <button id="dayModalDelete" class="btn ghost">Удалить</button>
        <button id="dayModalSave" class="btn">Сохранить</button>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
